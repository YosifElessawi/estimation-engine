[project]
name = "estimation-engine"
version = "0.1.0"
description = "A bot for Estimation, the 4-player trick-taking card game, played by the rules of the Pocket Estimation app."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "rich>=15.0.0",
    "torch>=2.14.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "estimation"

[tool.ruff]
line-length = 100
target-version = "py312"
# SPEC.md is Yosif's; ruff must not reformat the code blocks in any Markdown file.
# src/estimation/jaxenv is Essam Gouda's code, kept as it is in estimation-arena so later fixes
# there can be brought over by diff (see its __init__.py). force-exclude applies both to the
# file names pre-commit passes.
extend-exclude = ["*.md", "src/estimation/jaxenv"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PIE", "PT"]

[tool.pyright]
include = ["src", "server", "tests"]
strict = [
    "src/estimation/engine",
    "src/estimation/bots",
    "src/estimation/arena",
    "src/estimation/rl",
    "server",
]
# Essam Gouda's copied JAX code (src/estimation/jaxenv) is held to its move-by-move check
# against the engine (tests/jaxenv), not to pyright: its annotations are loose (an "int" that is
# a traced array) and stay as in estimation-arena, so later fixes there can be diffed in.
ignore = ["src/estimation/jaxenv"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "hypothesis>=6.170.9",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.2",
    # Step 5's JAX rules and nets (src/estimation/jaxenv): CPU here for the tests; the home
    # server's GPU runs use the same version with CUDA (jax[cuda12]).
    "jax==0.12.0.1",
    "optax>=0.2.8",
]
