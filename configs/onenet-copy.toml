# Step 5 of docs/rl/hybrid-iteration-plan.md: copy Hybrid v4 into the one net.
#
# The training set, on the Mac (about 3 min), then the copy, on the home server's GPU:
#   uv run python -m estimation.onenet.data --record runs/onenet/record --out runs/onenet/data
#   PYTHONPATH=src ~/jax-env/bin/python -m estimation.onenet.copy_hybrid \
#       --config configs/onenet-copy.toml --out runs/onenet/copy

[copy]
data = "runs/onenet/data"
sizes = ["384x3"]           # Essam's size; 512 x 4 copied no better (2.66 against 2.71 points a card)
epochs = 20                 # 12 passes were still improving
batch = 4096
lr = 1e-3                   # falling to lr_end along a cosine
lr_end = 3e-5
temperature = 2.0           # points: the values become chances by softmax(value / temperature)
held_out = 0.05             # 100 of the 2,000 Bolas, scored every epoch
practice_weight = 0.1       # each of the seven practice questions, next to the move's 1
played_weight = 1.0         # also Hybrid v4's own card moves where the teacher kept no values
seed = 20261107
