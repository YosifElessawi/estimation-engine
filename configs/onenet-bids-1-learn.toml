# Step 6 of docs/rl/hybrid-iteration-plan.md, bid lessons, round 1: the loop 4,000 player learns
# its bids from the bid teacher's lessons (configs/onenet-bids-1.toml) and keeps its card play.
#
# On the home server's GPU, from the repo, with its JAX env:
#   PYTHONPATH=src ~/jax-env/bin/python -m estimation.onenet.bid_learn \
#       --config configs/onenet-bids-1-learn.toml --out runs/onenet/bids-1/learn-2
#
# (runs/onenet/bids-1/learn holds the first try, which taught the player each lesson's measured
# lead directly: about half as much reached its bids.)

[learn]
lessons = "runs/onenet/bids-1/lessons"
cards = "runs/onenet/expert-2/data"  # round 2's training set: the player's own games
start = "runs/onenet/selfplay/snapshots/player-04000.npz"

# The lead models: what the lessons say about a decision, read from its view.
folds = 5               # each model reads the fifth of the training Bolas it was not fit on
lead_size = "512x3"
lead_epochs = 40
lead_lr = 1e-3
floor = 0.5             # points: the least error a measured lead is credited with
shuffle = true          # every estimate is seen under new suit shuffles

# The player learns the read leads.
margin = 0.5            # points a read lead must clear before that bid overtakes the player's move
temperature = 0.5       # points of read lead, past the margin, that multiply the bid's odds by e
clip = 5.0
epochs = 40
batch = 2048
lr = 3e-4
lr_end = 1e-5
card_weight = 1.0       # the card moves and
practice_weight = 1.0   # the practice answers are held to the starting player's
held_out = 0.05         # of the lessons' Bolas
card_shards = 40        # about a million card decisions to hold the card play on
card_held_out = 0.05    # round 2's own held-out Bolas (configs/onenet-expert-2-learn.toml),
card_seed = 20261108    # so its measure (top card 1.355, best of top 2 0.598) is taken again
seed = 20261115
