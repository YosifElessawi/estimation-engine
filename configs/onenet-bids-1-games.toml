# Step 6 of docs/rl/hybrid-iteration-plan.md, bid lessons, round 1: the games whose bidding
# decisions the bid teacher searches (configs/onenet-bids-1.toml). The loop 4,000 player inside
# its own search (its own guesses, round points) plays every seat on fresh deals, as in step 5's
# learning from the search, but with no card teacher: only the bidding is taught here.
#
#   uv run python -m estimation.rl.onenet_record run --config configs/onenet-bids-1-games.toml --out runs/onenet/bids-1/games
#   uv run python -m estimation.rl.onenet_record watch runs/onenet/bids-1/games

[record]
player = "onenet:net=runs/onenet/selfplay/snapshots/player-04000.npz:own=true:judge=round:top_k=2:samples=32"
games = 5000
part_games = 25
label_share = 0.0      # no card teacher: these games only supply bidding decisions
teacher_samples = 64   # not used at label_share 0
seed = 20261115        # fresh deals, not round 1's, round 2's or the Hybrid v4 recording's
workers = 5
